name: Merge CNIP
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  deduplicate_and_remove_empty_lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get and merge domains from source files
        run: |
          set -uo pipefail

          declare -a urls=(
            "https://ruleset.skk.moe/List/ip/china_ip.conf"
            "https://raw.githubusercontent.com/DH-Teams/DH-Geo_AS_IP_CN/main/Geo_AS_IP_CN_V4_Surge.list"
          )

          temp_file=$(mktemp)
          fail_count=0

          for url in "${urls[@]}"; do
            if ! curl -sSfL --retry 3 --retry-delay 2 "$url" >> "$temp_file"; then
              echo "::warning::Failed to fetch $url"
              fail_count=$((fail_count + 1))
            fi
            echo "" >> "$temp_file"
          done

          if [ "$fail_count" -eq "${#urls[@]}" ]; then
            echo "::error::All source URLs failed to fetch, aborting"
            rm -f "$temp_file"
            exit 1
          fi

          mkdir -p Rule

          # 仅保留 IP-CIDR 和 IP-CIDR6 行，去除 no-resolve，去除注释和空白
          cat "$temp_file" |
            tr -d '\r' |
            grep -E '^IP-CIDR|^IP-CIDR6' |
            sed 's/,no-resolve//g' |
            sed 's/#.*$//g' |
            sed 's/\/\/.*$//g' |
            grep -v '^$' |
            sort -u > Rule/cnip.list.tmp

          if [ -s Rule/cnip.list.tmp ]; then
            mv Rule/cnip.list.tmp Rule/cnip.list
          else
            echo "::error::Generated list is empty, keeping previous version"
            rm -f Rule/cnip.list.tmp
            exit 1
          fi

          rm -f "$temp_file"

      - name: Check and Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Force add changes
        run: git add Rule/cnip.list

      - name: Commit and push changes if needed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "Auto Update cnip.list ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
